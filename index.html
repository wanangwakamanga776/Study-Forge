<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Forge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
        .title-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        input[type="range"] { accent-color: #3b82f6; }
        #focus-screen { display: none; position: fixed; inset: 0; background: black; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="p-6 border-b border-white/10 flex justify-between items-center">
        <h1 class="title-font text-2xl font-bold text-blue-500 tracking-widest">STUDY FORGE</h1>
        <div class="flex gap-4 text-xs font-bold text-slate-500">
            <span>PLANNER</span>
            <span>FORGE</span>
        </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="glass p-8 rounded-3xl">
                <h2 class="title-font text-xl mb-6">Forge Station</h2>
                
                <div class="border-2 border-dashed border-slate-700 rounded-2xl p-12 text-center mb-8">
                    <p class="text-slate-500">PDF Document Ready for Refinement</p>
                </div>

                <div class="space-y-10">
                    <div>
                        <div class="flex justify-between text-sm font-bold mb-4">
                            <span class="text-slate-400">ITEM QUANTITY</span>
                            <span id="qty-display" class="text-blue-500">25</span>
                        </div>
                        <input type="range" min="5" max="50" value="25" class="w-full" oninput="document.getElementById('qty-display').innerText = this.value">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button class="bg-blue-600 p-4 rounded-xl font-bold shadow-lg shadow-blue-900/20" onclick="alert('Forging Quiz...')">Forge Quiz</button>
                        <button class="bg-slate-800 p-4 rounded-xl font-bold" onclick="alert('Casting Flashcards...')">Forge Flashcards</button>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-500 block mb-4">DIFFICULTY</label>
                        <div class="flex gap-3">
                            <button class="flex-1 py-2 rounded-lg border-2 border-green-500 text-green-500 font-bold" onclick="console.log('Easy')">Easy</button>
                            <button class="flex-1 py-2 rounded-lg border-2 border-yellow-500 text-yellow-500 font-bold" onclick="console.log('Medium')">Med</button>
                            <button class="flex-1 py-2 rounded-lg border-2 border-red-500 text-red-500 font-bold" onclick="console.log('Hard')">Hard</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="glass p-6 rounded-3xl text-center">
                <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">Focus Forge</h3>
                <div id="main-timer" class="text-5xl font-bold font-mono mb-6">25:00</div>
                <button onclick="startFocusMode()" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold">Start Deep Work</button>
            </div>

            <div class="glass p-6 rounded-3xl">
                <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">Task Ledger</h3>
                <div class="space-y-3">
                    <div class="bg-slate-900 p-4 rounded-xl border-l-4 border-red-700">
                        <p class="font-bold text-sm">Exam: Physics</p>
                        <span class="text-[10px] text-red-500">Top Priority</span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-xl border-l-4 border-orange-500">
                        <p class="font-bold text-sm">Forge History Quiz</p>
                        <span class="text-[10px] text-orange-500">High Priority</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="focus-screen">
        <h2 class="title-font text-blue-500 text-2xl tracking-[1em] mb-12">FORGING FOCUS</h2>
        <div id="big-timer" class="text-[12rem] font-bold font-mono mb-12">25:00</div>
        <button onclick="stopFocusMode()" class="px-10 py-4 border border-red-600 text-red-600 rounded-full font-bold uppercase tracking-widest">Exit Forge</button>
    </div>

    <script>
        let timeLeft = 1500;
        let active = false;
        let timer = null;

        function updateTimers() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('main-timer').innerText = m + ":" + s;
            document.getElementById('big-timer').innerText = m + ":" + s;
        }

        function startFocusMode() {
            document.getElementById('focus-screen').style.display = 'flex';
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
            timer = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    updateTimers();
                }
            }, 1000);
        }

        function stopFocusMode() {
            clearInterval(timer);
            document.getElementById('focus-screen').style.display = 'none';
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        // Listen for Esc key to close focus mode
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                stopFocusMode();
            }
        });
    </script>
</body>
</html>
