<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Forge</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top right, #1e293b, #0f172a);
    color: #f8fafc;
    min-height: 100vh;
    margin: 0;
}
.title-font { font-family: 'Orbitron', sans-serif; }
.glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>

<body class="antialiased">

<nav class="p-6 border-b border-white/10 flex justify-between items-center max-w-7xl mx-auto">
    <h1 class="title-font text-2xl font-bold text-blue-500 tracking-widest">STUDY FORGE</h1>
</nav>

<main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

<!-- LEFT SIDE -->
<div class="lg:col-span-2 space-y-6">

<div class="glass p-8 rounded-3xl">
<h2 class="title-font text-xl mb-6">Forge Station</h2>

<div class="space-y-6">

<div>
<div class="flex justify-between text-sm font-bold mb-4">
<span>QUANTITY</span>
<span id="qty-val" class="text-blue-400">25</span>
</div>
<input type="range" id="qty-slider" min="5" max="50" value="25" class="w-full">
</div>

<div class="grid grid-cols-2 gap-4">
<button class="bg-blue-600 p-4 rounded-xl font-bold"
onclick="alert('Forging Quiz...')">Forge Quiz</button>

<button class="bg-slate-800 p-4 rounded-xl font-bold"
onclick="alert('Casting Flashcards...')">Forge Flashcards</button>
</div>

</div>
</div>
</div>

<!-- RIGHT SIDE -->
<div class="space-y-6">

<div class="glass p-6 rounded-3xl text-center">
<h3 class="text-xs font-bold mb-4 uppercase">Focus Forge</h3>
<div id="main-timer" class="text-5xl font-bold font-mono mb-6">25:00</div>
<button onclick="startFocusMode()" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold">
Start Deep Work
</button>
</div>

</div>

</main>

<!-- FULLSCREEN FOCUS -->
<div id="focus-screen" style="display:none; position:fixed; inset:0; background:black; z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
<h2 class="title-font text-blue-500 text-2xl tracking-[1em] mb-12">FORGING FOCUS</h2>
<div id="big-timer" class="text-[6rem] font-bold font-mono mb-12">25:00</div>
<button onclick="stopFocusMode()" class="px-10 py-4 border border-red-600 text-red-600 rounded-full font-bold uppercase tracking-widest">
Exit Forge
</button>
</div>

<script>

const slider = document.getElementById('qty-slider');
const qtyVal = document.getElementById('qty-val');
slider.oninput = () => qtyVal.innerText = slider.value;

let timeLeft = 1500;
let timer = null;

function updateTimers() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('main-timer').innerText = m + ":" + s;
    document.getElementById('big-timer').innerText = m + ":" + s;
}

function startFocusMode() {
    document.getElementById('focus-screen').style.display = 'flex';
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
    timer = setInterval(() => {
        if(timeLeft > 0){
            timeLeft--;
            updateTimers();
        }
    },1000);
}

function stopFocusMode() {
    clearInterval(timer);
    document.getElementById('focus-screen').style.display = 'none';
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
}

</script>

</body>
</html>
